<body class="bg-gray-100 p-8 font-sans">

    <main class="calendar-app max-w-[95%] mx-auto my-8 rounded-lg overflow-hidden shadow-xl flex bg-white border border-gray-300"
        style="min-height: 800px;"
        x-data="dailyApp()">


        <div class="control-panel flex-shrink-0 w-72 p-6 bg-slate-50 border-r border-slate-200 overflow-y-auto custom-scrollbar">

            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-indigo-950" x-text="current_year + ' ' + (currentLang==='tr'?'Günlük':'Daily')"></h2>
                <div class="flex gap-1 bg-white p-1 rounded border border-indigo-100 shadow-sm">
                    <button @click="switchLanguage('tr')" :class="{'bg-indigo-600 text-white': currentLang === 'tr', 'text-indigo-600 hover:bg-indigo-50': currentLang !== 'tr'}" class="px-2 py-1 text-xs font-bold rounded transition">TR</button>
                    <button @click="switchLanguage('en')" :class="{'bg-indigo-600 text-white': currentLang === 'en', 'text-indigo-600 hover:bg-indigo-50': currentLang !== 'en'}" class="px-2 py-1 text-xs font-bold rounded transition">EN</button>
                </div>
            </div>

            <div class="mb-4 bg-white p-3 rounded border border-indigo-100">
                <p class="text-xs font-bold text-indigo-900 mb-2 uppercase" x-text="ui.viewSettings"></p>
                <div class="mb-2">
                    <label class="block text-[0.65rem] text-slate-500 font-bold mb-1" x-text="ui.viewStart"></label>
                    <input type="date" x-model="viewStart" class="w-full text-sm p-1 border border-indigo-200 rounded">
                </div>
                <div>
                    <label class="block text-[0.65rem] text-slate-500 font-bold mb-1" x-text="ui.viewDuration"></label>
                    <input type="number" x-model.number="viewDuration" class="w-full text-sm p-1 border border-indigo-200 rounded">
                </div>
            </div>


            <button @click="downloadImage()" class="w-full py-2 text-sm bg-indigo-600 text-white rounded font-semibold shadow-sm hover:bg-indigo-700 transition mb-2" x-text="ui.download">
            </button>
            <button @click="window.print()" class="w-full py-2 text-sm bg-violet-600 text-white rounded font-semibold shadow-sm hover:bg-violet-700 transition mb-2" x-text="ui.print">
            </button>
            <button @click="exportData()" class="w-full py-2 text-sm bg-teal-600 text-white rounded font-semibold shadow-sm hover:bg-teal-700 transition mb-2" x-text="ui.export">
            </button>
            <input type="file" id="fi" @change="importData" class="hidden">
            <button onclick="document.getElementById('fi').click()" class="w-full py-2 text-sm bg-emerald-600 text-white rounded font-semibold shadow-sm hover:bg-emerald-700 transition mb-2" x-text="ui.import">
            </button>
            <button @click="clearAllData()" class="w-full py-2 text-sm bg-red-600 text-white rounded font-semibold shadow-sm hover:bg-red-700 transition mb-4" x-text="ui.clearAll">
            </button>

            <hr class="my-6 border-slate-200">

            <div class="flex justify-between items-center mb-3">

                <span class="text-xs text-indigo-400 font-semibold" x-text="habits.length"></span>
            </div>

            <div class="space-y-2 mb-6">
                <template x-for="(h, i) in habits" :key="i">

                        <div class="absolute top-1 right-1 flex gap-0.5">
                            <button @click="moveHabit(i, 'up')" :disabled="i===0" class="text-[0.6rem] w-5 h-5 flex items-center justify-center text-slate-400 hover:text-indigo-600 disabled:opacity-30 transition" title="Up">▲</button>
                            <button @click="moveHabit(i, 'down')" :disabled="i===habits.length-1" class="text-[0.6rem] w-5 h-5 flex items-center justify-center text-slate-400 hover:text-indigo-600 disabled:opacity-30 transition" title="Down">▼</button>
                            <button @click="deleteHabit(i)" class="text-[0.6rem] w-5 h-5 flex items-center justify-center text-red-300 hover:text-red-500 font-bold transition ml-1" title="Delete">✕</button>
                        </div>
                        <span class="text-sm font-bold text-indigo-950 block mb-2" x-text="h.title"></span>

                        <div class="bg-indigo-50/50 rounded p-1.5 space-y-1.5">
                            <div class="flex justify-between text-xs items-center border-b border-indigo-100 pb-1">
                                <div class="flex items-center text-indigo-700">
                                    <span class="mr-1 opacity-70">🕒</span>
                                    <span class="font-semibold" x-text="h.start"></span>
                                </div>
                                <div x-show="h.interval > 0" class="text-indigo-600 flex items-center">
                                    <span class="mr-1 opacity-70">🔄</span>
                                    <span x-text="h.interval + ' ' + (currentLang==='tr'?'sa':'hr')"></span>
                                </div>
                            </div>
                            <div class="flex flex-col text-[0.65rem]">

                                <div class="flex justify-between items-center text-slate-700 font-medium">
                                    <span x-text="formatDateTr(h.startDate)"></span>
                                    <span class="text-slate-300">➜</span>
                                    <span x-text="calculateEndDate(h.startDate, h.duration)"></span>
                                </div>
                                <div class="text-right text-[0.6rem] text-slate-400 mt-0.5" x-text="'(' + h.duration + ' ' + (currentLang==='tr'?'Gün':'Days') + ')'"></div>
                            </div>
                        </div>
                    </div>
                </template>
                <div x-show="habits.length===0" class="text-center text-xs text-slate-400 italic" x-text="ui.emptyList"></div>
            </div>


            <div class="p-4 border border-indigo-100 rounded-lg bg-indigo-50/50">
                <p class="text-sm font-semibold mb-2 text-indigo-900" x-text="ui.addNew"></p>
                <input type="text" x-model="newHabit.title" :placeholder="ui.habitTitlePlaceholder" class="w-full p-2 text-sm border border-indigo-200 rounded mb-2">
                <div class="grid grid-cols-2 gap-2 mb-2">
                    <div>
                        <label class="block text-[0.6rem] text-indigo-800 font-bold mb-1" x-text="ui.time"></label>
                        <input type="time" x-model="newHabit.start" class="w-full text-xs p-1 border border-indigo-200 rounded">
                    </div>
                    <div>
                        <label class="block text-[0.6rem] text-indigo-800 font-bold mb-1" x-text="ui.interval"></label>
                        <input type="number" x-model="newHabit.interval" class="w-full text-xs p-1 border border-indigo-200 rounded">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2 mb-2">
                    <div>
                        <label class="block text-[0.6rem] text-indigo-800 font-bold mb-1" x-text="ui.startDate"></label>
                        <input type="date" x-model="newHabit.startDate" class="w-full text-xs p-1 border border-indigo-200 rounded">
                    </div>
                    <div>
                        <label class="block text-[0.6rem] text-indigo-800 font-bold mb-1" x-text="ui.duration"></label>
                        <input type="number" x-model="newHabit.duration" class="w-full text-xs p-1 border border-indigo-200 rounded">
                    </div>
                </div>
                <button @click="addHabit()" :disabled="!newHabit.title" class="w-full py-2 text-sm bg-indigo-600 text-white rounded font-semibold hover:bg-indigo-700 transition disabled:opacity-50" x-text="ui.addButton"></button>
            </div>

        </div>


        <div id="calendar-area" class="flex-grow flex flex-col bg-white overflow-hidden relative px-8 py-6 h-full overflow-y-auto">

            <h1 class="font-extrabold mb-6 text-center text-gray-800 text-2xl">
                <span x-text="formatDateTitle(viewStart)"></span> - <span x-text="formatDateTitle(viewEnd)"></span>
            </h1>


            <template x-for="dayObj in daysList" :key="dayObj.iso">
                <div class="mb-0">



                    <div class="grid grid-daily border-t border-gray-400 py-1 bg-white">


                        <div class="font-bold text-sm text-right pr-2 text-gray-900 border-b border-gray-400 flex flex-col justify-center items-end">
                            <span x-text="dayObj.displayDate"></span>
                            <span class="text-[0.6rem] text-gray-500" x-text="dayObj.displayDay"></span>
                        </div>


                        <template x-for="(t, i) in timeSlots">

                            <div class="flex flex-col justify-end items-center h-8 border-b border-gray-400 relative"
                                :class="t.endsWith('30') ? 'bg-gray-50' : ''">


                                <span class="text-[0.55rem] font-bold text-gray-700 leading-none mb-1"
                                    x-show="t.endsWith('00')"
                                    x-text="t.substring(0,2)"
                                    style="transform: rotate(0deg);"></span>


                                <div x-show="t.endsWith('30')" class="h-1 w-px bg-gray-300"></div>
                            </div>
                        </template>
                    </div>


                    <template x-for="(h, hIdx) in habits" :key="hIdx">
                        <template x-if="isHabitActive(h, dayObj.iso)">

                            <div class="grid grid-daily">


                                <div class="flex items-center justify-end pr-2 h-5 text-xs font-semibold text-gray-600 border-b border-gray-200 truncate"
                                    x-text="h.title" :title="h.title">
                                </div>


                                <template x-for="(t, tIdx) in timeSlots" :key="tIdx">
                                    <div class="flex justify-center items-center h-5 border-b border-gray-200 relative"
                                        :class="t.endsWith('30') ? 'bg-gray-50' : ''">


                                        <div x-show="isTargetSlot(h, tIdx)" class="absolute inset-0 bg-indigo-50/50 pointer-events-none"></div>

                                        <input type="checkbox"
                                            :checked="isChecked(dayObj.iso, hIdx, tIdx)"
                                            @change="toggleCheck(dayObj.iso, hIdx, tIdx)"
                                            class="form-checkbox custom-checkbox border-gray-400 text-indigo-600 focus:ring-0 z-10"
                                            :class="isTargetSlot(h, tIdx) ? 'opacity-100' : 'opacity-10 hover:opacity-100'">
                                    </div>
                                </template>

                            </div>
                        </template>
                    </template>

                    <div x-show="!hasActiveHabits(dayObj.iso)" class="text-center text-xs text-gray-400 italic py-2 border-b border-gray-200" x-text="ui.noData">
                    </div>

                </div>
            </template>

        </div>

    </main>

    <script>
        function dailyApp() {
            return {
                viewStart: '2026-01-01',


                habits: [],
                records: {},
                newHabit: {
                    title: '',
                    start: '08:00',
                    interval: 0,
                    startDate: '',
                    duration: 30
                },
                timeSlots: [],

                currentLang: 'tr',

                uiText: {
                    tr: {
                        viewSettings: 'Görünüm Ayarları',
                        viewStart: 'GÖRÜNÜM BAŞLANGIÇ',
                        viewDuration: 'SÜRE (GÜN)',
                        download: 'Görsel İndir (PNG)',
                        print: 'Yazdır (A4 Dikey)',
                        export: 'Dışa Aktar',
                        import: 'İçe Aktar',
                        clearAll: 'Tüm Verileri Temizle',
                        habits: 'Alışkanlıklar',
                        emptyList: 'Liste boş.',
                        addNew: 'Yeni Ekle',
                        habitTitlePlaceholder: 'Başlık',
                        time: 'SAAT',
                        interval: 'ARA (SAAT)',
                        startDate: 'BAŞLANGIÇ',
                        validity: 'GEÇERLİLİK',
                        duration: 'SÜRE (GÜN)',
                        addButton: 'EKLE',
                        noData: 'Kayıt yok.',
                        confirmDelete: 'Sil?',
                        confirmClearAll: 'Tüm alışkanlıklar ve kayıtlar silinecek. Emin misiniz?',
                        confirmImport: 'Yüklensin mi?',
                        months: ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'],
                        days: ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt']
                    },
                    en: {
                        viewSettings: 'View Settings',
                        viewStart: 'VIEW START',
                        viewDuration: 'DURATION (DAYS)',
                        download: 'Download Image (PNG)',
                        print: 'Print (A4 Portrait)',
                        export: 'Export JSON',
                        import: 'Import JSON',
                        clearAll: 'Clear All Data',
                        habits: 'Habits',
                        emptyList: 'List is empty.',
                        addNew: 'Add New',
                        habitTitlePlaceholder: 'Title',
                        time: 'TIME',
                        interval: 'INTERVAL (HRS)',
                        startDate: 'START DATE',
                        validity: 'VALIDITY',
                        duration: 'DURATION (DAYS)',
                        addButton: 'ADD',
                        noData: 'No record.',
                        confirmDelete: 'Delete?',
                        confirmClearAll: 'All habits and records will be deleted. Are you sure?',
                        confirmImport: 'Import?',
                        months: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'],
                        days: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']
                    }
                },

                get ui() {
                    return this.uiText[this.currentLang];
                },
                get monthNames() {
                    return this.ui.months;
                },
                get dayNames() {
                    return this.ui.days;
                },

                switchLanguage(lang) {
                    this.currentLang = lang;
                    localStorage.setItem('daily_lang_v1', lang);
                },

                init() {
                    this.currentLang = localStorage.getItem('daily_lang_v1') || 'tr';
                    this.newHabit.startDate = this.viewStart;
                    this.generateTimeSlots();
                    this.loadData();

                },

                get viewEnd() {
                    if (!this.viewStart) return '';
                    const d = new Date(this.viewStart);
                    d.setDate(d.getDate() + (this.viewDuration - 1));
                    return d.toISOString().split('T')[0];
                },

                get daysList() {
                    if (!this.viewStart || this.viewDuration < 1) return [];
                    const list = [];
                    const current = new Date(this.viewStart);
                    for (let i = 0; i < this.viewDuration; i++) {
                        const iso = current.toISOString().split('T')[0];
                        const dayName = this.dayNames[current.getDay()];
                        const mockDate = current.getDate() + ' ' + this.monthNames[current.getMonth()];
                        list.push({
                            iso,
                            displayDate: mockDate,
                            displayDay: dayName
                        });
                        current.setDate(current.getDate() + 1);
                    }
                    return list;
                },

                formatDateTr(iso) {
                    if (!iso) return '';
                    const d = new Date(iso);
                    return d.getDate() + ' ' + this.monthNames[d.getMonth()];
                },

                calculateEndDate(start, duration) {
                    if (!start) return '';
                    const d = new Date(start);
                    d.setDate(d.getDate() + (parseInt(duration) - 1));
                    return this.formatDateTr(d.toISOString().split('T')[0]);
                },

                generateTimeSlots() {
                    for (let i = 0; i < 24; i++) {
                        this.timeSlots.push(String(i).padStart(2, '0') + ':00');
                        this.timeSlots.push(String(i).padStart(2, '0') + ':30');
                    }
                },

                hasActiveHabits(iso) {
                    return this.habits.some(h => this.isHabitActive(h, iso));
                },

                isHabitActive(habit, iso) {
                    if (!habit.startDate) return true;
                    const c = new Date(iso);
                    c.setHours(0, 0, 0, 0);
                    const s = new Date(habit.startDate);
                    s.setHours(0, 0, 0, 0);
                    const e = new Date(s);
                    e.setDate(e.getDate() + parseInt(habit.duration));
                    return c >= s && c < e;
                },

                isTargetSlot(habit, tIdx) {
                    if (!habit.start) return false;
                    const [h, m] = habit.start.split(':').map(Number);
                    const startSlot = h * 2 + (m >= 30 ? 1 : 0);
                    if (tIdx === startSlot) return true;
                    if (habit.interval > 0 && tIdx > startSlot) return (tIdx - startSlot) % (habit.interval * 2) === 0;
                    return false;
                },

                isChecked(iso, hIdx, tIdx) {
                    return this.records[iso] && this.records[iso][hIdx] && this.records[iso][hIdx][tIdx];
                },

                toggleCheck(iso, hIdx, tIdx) {
                    if (!this.records[iso]) this.records[iso] = {};
                    if (!this.records[iso][hIdx]) this.records[iso][hIdx] = {};
                    if (this.records[iso][hIdx][tIdx]) delete this.records[iso][hIdx][tIdx];
                    else this.records[iso][hIdx][tIdx] = true;
                    this.saveData();
                },

                loadData() {
                    const h = localStorage.getItem('daily_habits_v2');
                    if (h) this.habits = JSON.parse(h);
                    const r = localStorage.getItem('daily_records_v2');
                    if (r) this.records = JSON.parse(r);
                },

                saveData() {
                    localStorage.setItem('daily_habits_v2', JSON.stringify(this.habits));
                    localStorage.setItem('daily_records_v2', JSON.stringify(this.records));
                },

                addHabit() {
                    this.habits.push({
                        ...this.newHabit
                    });
                    this.saveData();
                    this.newHabit.title = '';
                },

                deleteHabit(i) {
                    if (confirm(this.ui.confirmDelete)) {
                        this.habits.splice(i, 1);
                        this.saveData();
                    }
                },

                moveHabit(index, direction) {
                    if (direction === 'up' && index > 0) {

                        const temp = this.habits[index];
                        this.habits[index] = this.habits[index - 1];
                        this.habits[index - 1] = temp;
                    } else if (direction === 'down' && index < this.habits.length - 1) {

                        const temp = this.habits[index];
                        this.habits[index] = this.habits[index + 1];
                        this.habits[index + 1] = temp;
                    }
                    this.saveData();
                },

                clearAllData() {
                    if (confirm(this.ui.confirmClearAll)) {
                        this.habits = [];
                        this.records = {};
                        this.saveData();
                        this.deleteCookie('cookie_accepted');
                    }
                },

                deleteCookie(name) {
                    document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
                },

                exportData() {
                    const d = {
                        app: 'daily_habits',
                        habits: this.habits,
                        records: this.records
                    };
                    const b = new Blob([JSON.stringify(d)], {
                        type: 'application/json'
                    });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(b);
                    a.download = 'daily.json';
                    a.click();
                },

                importData(e) {
                    const f = e.target.files[0];
                    if (!f) return;
                    const r = new FileReader();
                    r.onload = (evt) => {
                        const d = JSON.parse(evt.target.result);
                        if (confirm(this.ui.confirmImport)) {
                            this.habits = d.habits || [];
                            this.records = d.records || {};
                            this.saveData();
                        }
                    };
                    r.readAsText(f);
                },

                formatDateTitle(iso) {
                    if (!iso) return '';
                    const d = new Date(iso);
                    return d.getDate() + ' ' + this.monthNames[d.getMonth()] + ' ' + d.getFullYear();
                },

                downloadImage() {
                    const t = document.getElementById('calendar-area');

                    html2canvas(t, {
                        scale: 2,
                        backgroundColor: '#fff'
                    }).then(c => {
                        const a = document.createElement('a');
                        a.download = 'daily_plan.png';
                        a.href = c.toDataURL();
                        a.click();
                    });
                }
            }
        }
    </script>

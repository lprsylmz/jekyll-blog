---
layout: default
---

<div class="space-y-6">
    <article
        class="p-4 border border-brand-dark/10 dark:border-brand-light/10 rounded-xl shadow-2xl bg-transparent">
        <div class="flex items-start space-x-3">
            <div class="flex-1 min-w-0">
                <!-- Tarih -->
                <div class="flex items-center space-x-1 mb-1">
                    <time
                        class="text-sm text-brand-dark/50 dark:text-brand-light/50 whitespace-nowrap relative-time"
                        datetime="{{ page.date | date_to_xmlschema }}"
                        data-timestamp="{{ page.date | date: '%s' }}">
                        {{ page.date | date: "%d.%m.%Y" }}
                    </time>
                </div>

                <!-- İçerik -->
                <div class="prose prose-neutral dark:prose-invert max-w-none text-justify
                  leading-relaxed text-lg text-brand-dark/90 dark:text-brand-light/90
                  [&_p]:mb-6 [&_h1]:mb-8 [&_h2]:mb-6 [&_h3]:mb-4
                  [&_ul]:mb-6 [&_ol]:mb-6 [&_li]:mb-2 [&_blockquote]:font-bold
                  [&_blockquote]:italic last:**:mb-0
                  [&_img]:mx-auto [&_img]:block [&_img]:rounded-lg [&_img]:max-w-full
                  [&_a]:text-brand-primary [&_a]:underline [&_a]:underline-offset-2
                  [&_pre]:whitespace-pre-wrap [&_pre]:break-words [&_pre]:rounded-lg
                  [&_hr]:my-8 [&_hr]:border-brand-dark/20 dark:[&_hr]:border-brand-light/20">
                    {{ content }}
                </div>

                <!-- Paylaşım Butonları (Article: Başlık/Title Paylaşılır) -->
                <div class="flex items-center justify-end gap-3 mt-6" x-data="{ shareOpen: false }">
                    <div x-show="shareOpen" x-cloak x-transition:enter="transition ease-out duration-200"
                        x-transition:enter-start="opacity-0 scale-95 translate-x-2"
                        x-transition:enter-end="opacity-100 scale-100 translate-x-0"
                        x-transition:leave="transition ease-in duration-150"
                        x-transition:leave-start="opacity-100 scale-100 translate-x-0"
                        x-transition:leave-end="opacity-0 scale-95 translate-x-2" class="flex gap-3">

                        {% assign share_url = page.url | absolute_url %}
                        {% assign share_text = page.title | url_encode %}
                        {% assign encoded_url = share_url | url_encode %}

                        <!-- X / Twitter -->
                        <a href="https://x.com/intent/post?text={{ share_text }}&url={{ encoded_url }}"
                            target="_blank" rel="noopener noreferrer"
                            class="w-10 h-10 flex items-center justify-center rounded-full border border-brand-accent/20 dark:border-brand-muted/20 hover:bg-brand-accent hover:text-white transition-all duration-300 group"
                            title="X'te paylaş">
                            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                                <path
                                    d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z" />
                            </svg>
                        </a>

                        <!-- Bluesky -->
                        <a href="https://bsky.app/intent/compose?text={{ share_text }}%20{{ encoded_url }}"
                            target="_blank" rel="noopener noreferrer"
                            class="w-10 h-10 flex items-center justify-center rounded-full border border-brand-accent/20 dark:border-brand-muted/20 hover:bg-brand-accent hover:text-white transition-all duration-300"
                            title="Bluesky'da paylaş">
                            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 600 530">
                                <path
                                    d="m135.72 44.03c66.496 49.921 138.02 151.14 164.28 205.46 26.262-54.316 97.782-155.54 164.28-205.46 47.98-36.021 125.72-63.892 125.72 24.795 0 17.712-10.155 148.79-16.111 170.07-20.703 73.984-96.144 92.854-163.25 81.433 117.3 19.964 147.14 86.092 82.697 152.22-122.39 125.59-175.91-31.511-189.63-71.766-2.514-7.3797-3.6904-10.832-3.7077-7.8964-0.0174-2.9357-1.1937 0.51669-3.7077 7.8964-13.714 40.255-67.233 197.36-189.63 71.766-64.444-66.128-34.605-132.26 82.697-152.22-67.108 11.421-142.55-7.4491-163.25-81.433-5.9562-21.282-16.111-152.36-16.111-170.07 0-88.687 77.742-60.816 125.72-24.795z" />
                            </svg>
                        </a>

                        <!-- WhatsApp -->
                        <a href="https://api.whatsapp.com/send?text={{ share_text }}%20{{ encoded_url }}"
                            target="_blank" rel="noopener noreferrer"
                            class="w-10 h-10 flex items-center justify-center rounded-full border border-brand-accent/20 dark:border-brand-muted/20 hover:bg-brand-accent hover:text-white transition-all duration-300"
                            title="WhatsApp'ta paylaş">
                            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                                <path
                                    d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z" />
                            </svg>
                        </a>

                        <!-- Bağlantıyı Kopyala -->
                        <button type="button" data-copy-url="{{ share_url }}"
                            class="copy-trigger w-10 h-10 flex items-center justify-center rounded-full border border-brand-accent/20 dark:border-brand-muted/20 hover:bg-brand-accent hover:text-white transition-all duration-300"
                            title="Bağlantıyı kopyala">
                            <svg class="copy-icon w-5 h-5" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                            </svg>
                            <svg class="check-icon w-5 h-5 hidden text-green-500" fill="none"
                                stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M5 13l4 4L19 7" />
                            </svg>
                        </button>
                    </div>

                    <!-- Ana Tetikleyici Buton -->
                    <button type="button" @click="shareOpen = !shareOpen"
                        class="w-10 h-10 flex items-center justify-center rounded-full border border-brand-accent/20 dark:border-brand-muted/20 hover:bg-brand-accent hover:text-white transition-all duration-300"
                        :class="shareOpen ? 'bg-brand-accent text-white border-transparent' : ''"
                        title="Paylaş">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                            <path
                                d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z" />
                        </svg>
                    </button>
                </div>

            </div>
        </div>
    </article>
</div>

<!-- Göreceli Tarih, Hashtag ve Kopyalama Scripti -->
<script>
    (function () {
        const journalPath = "{{ '/journal/' | relative_url }}";
        const nowSec = Math.floor(Date.now() / 1000);
        const nodes = document.querySelectorAll('.relative-time[data-timestamp]');

        const formatRelativeTime = (diffSec) => {
            if (diffSec < 60) return 'şimdi';
            if (diffSec < 3600) return `${Math.floor(diffSec / 60)}dk`;
            if (diffSec < 86400) return `${Math.floor(diffSec / 3600)}sa`;
            if (diffSec < 604800) return `${Math.floor(diffSec / 86400)}g`;
            if (diffSec < 2592000) return `${Math.floor(diffSec / 604800)}hf`;
            if (diffSec < 31536000) return `${Math.floor(diffSec / 2592000)}ay`;
            return `${Math.floor(diffSec / 31536000)}y`;
        };

        nodes.forEach((node) => {
            const ts = Number(node.dataset.timestamp);
            if (!Number.isFinite(ts)) return;
            const diff = Math.max(0, nowSec - ts);
            node.textContent = formatRelativeTime(diff);
        });

        // Hashtag Dönüştürücü
        const proseElements = document.querySelectorAll('.prose');
        const tagRegex = /(^|\s)#([a-zA-Z0-9çğıöşüÇĞİÖŞÜ_-]+)/g;

        proseElements.forEach(el => {
            const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null, false);
            const textNodes = [];
            let currentNode;

            while (currentNode = walker.nextNode()) {
                const parentTag = currentNode.parentNode.tagName;
                if (parentTag !== 'A' && parentTag !== 'SCRIPT' && parentTag !== 'STYLE' && parentTag !== 'CODE') {
                    textNodes.push(currentNode);
                }
            }

            textNodes.forEach(node => {
                if (node.nodeValue.includes('#')) {
                    const tempContainer = document.createElement('span');
                    tempContainer.innerHTML = node.nodeValue.replace(tagRegex, function (match, space, tag) {
                        return space + `<a href="${journalPath}?tag=${encodeURIComponent(tag)}" class="font-bold hover:underline">#${tag}</a>`;
                    });

                    while (tempContainer.firstChild) {
                        node.parentNode.insertBefore(tempContainer.firstChild, node);
                    }
                    node.parentNode.removeChild(node);
                }
            });
        });

        // Panoya Kopyalama İşlevi
        document.querySelectorAll('.copy-trigger').forEach(btn => {
            btn.addEventListener('click', async () => {
                const url = btn.getAttribute('data-copy-url');
                if (!url) return;
                try {
                    await navigator.clipboard.writeText(url);
                    const copyIcon = btn.querySelector('.copy-icon');
                    const checkIcon = btn.querySelector('.check-icon');
                    if (copyIcon && checkIcon) {
                        copyIcon.classList.add('hidden');
                        checkIcon.classList.remove('hidden');
                        setTimeout(() => {
                            copyIcon.classList.remove('hidden');
                            checkIcon.classList.add('hidden');
                        }, 2000);
                    }
                } catch (err) {
                    console.error('Kopyalama başarısız:', err);
                }
            });
        });
    })();
</script>

<!-- Göreceli Tarih, Hashtag ve Kopyalama Scripti -->
<script>
    (function () {
        const journalPath = "{{ '/journal/' | relative_url }}";
        const nowSec = Math.floor(Date.now() / 1000);
        const nodes = document.querySelectorAll('.relative-time[data-timestamp]');

        const formatRelativeTime = (diffSec) => {
            if (diffSec < 60) return 'şimdi';
            if (diffSec < 3600) return `${Math.floor(diffSec / 60)}dk`;
            if (diffSec < 86400) return `${Math.floor(diffSec / 3600)}sa`;
            if (diffSec < 604800) return `${Math.floor(diffSec / 86400)}g`;
            if (diffSec < 2592000) return `${Math.floor(diffSec / 604800)}hf`;
            if (diffSec < 31536000) return `${Math.floor(diffSec / 2592000)}ay`;
            return `${Math.floor(diffSec / 31536000)}y`;
        };

        nodes.forEach((node) => {
            const ts = Number(node.dataset.timestamp);
            if (!Number.isFinite(ts)) return;
            const diff = Math.max(0, nowSec - ts);
            node.textContent = formatRelativeTime(diff);
        });

        // Hashtag Dönüştürücü
        const proseElements = document.querySelectorAll('.prose');
        const tagRegex = /(^|\s)#([a-zA-Z0-9çğıöşüÇĞİÖŞÜ_-]+)/g;

        proseElements.forEach(el => {
            const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null, false);
            const textNodes = [];
            let currentNode;

            while (currentNode = walker.nextNode()) {
                const parentTag = currentNode.parentNode.tagName;
                if (parentTag !== 'A' && parentTag !== 'SCRIPT' && parentTag !== 'STYLE' && parentTag !== 'CODE') {
                    textNodes.push(currentNode);
                }
            }

            textNodes.forEach(node => {
                if (node.nodeValue.includes('#')) {
                    const tempContainer = document.createElement('span');
                    tempContainer.innerHTML = node.nodeValue.replace(tagRegex, function (match, space, tag) {
                        return space + `<a href="${journalPath}?tag=${encodeURIComponent(tag)}" class="font-bold hover:underline">#${tag}</a>`;
                    });

                    while (tempContainer.firstChild) {
                        node.parentNode.insertBefore(tempContainer.firstChild, node);
                    }
                    node.parentNode.removeChild(node);
                }
            });
        });

        // Panoya Kopyalama İşlevi
        document.querySelectorAll('.copy-trigger').forEach(btn => {
            btn.addEventListener('click', async () => {
                const url = btn.getAttribute('data-copy-url');
                if (!url) return;
                try {
                    await navigator.clipboard.writeText(url);
                    const copyIcon = btn.querySelector('.copy-icon');
                    const checkIcon = btn.querySelector('.check-icon');
                    if (copyIcon && checkIcon) {
                        copyIcon.classList.add('hidden');
                        checkIcon.classList.remove('hidden');
                        setTimeout(() => {
                            copyIcon.classList.remove('hidden');
                            checkIcon.classList.add('hidden');
                        }, 2000);
                    }
                } catch (err) {
                    console.error('Kopyalama başarısız:', err);
                }
            });
        });
    })();
</script>

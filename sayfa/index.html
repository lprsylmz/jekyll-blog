<!DOCTYPE html>
<html lang="tr">

<head>
    <base href="../">
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow, max-image-preview:large, nosnippet">
    <meta name="googlebot" content="noindex, nofollow, max-image-preview:large, nosnippet">
    <meta name="description" content="17x25 Kareli Defter">
    <meta name="author" content="Alper Söylemez">
    <meta http-equiv="content-language" content="tr">
    <title>17x25 Kareli Defter</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/css/main.css">
    <script defer src="assets/js/alpine.min.js"></script>
    <script src="assets/js/html2canvas-pro.min.js"></script>
    <style>
        :root {
            --cell: 5mm;
            --cols: 17;
            --rows: 25;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(var(--cols), var(--cell));
            grid-template-rows: repeat(var(--rows), var(--cell));
        }

        .cell {
            border: 1px solid #d1d5db;
        }

        .sheet {
            position: relative;
            width: calc(var(--cols) * var(--cell));
            height: calc(var(--rows) * var(--cell));
        }

        .overlay-text {
            position: absolute;
            inset: 0;
            resize: none;
            background: transparent;
            outline: none;
            border: none;

            font-size: 14px;
            line-height: 5mm;

            padding: 2px;
            color: #000;

            white-space: pre-wrap;
            /* satır sonları korunur */
            word-break: break-word;
            /* taşma engellenir */
            font-family: monospace;
            /* boşluklar birebir görünür */
        }
    </style>
</head>

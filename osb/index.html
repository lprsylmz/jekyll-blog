<!DOCTYPE html>
<html lang="tr">

<head>
    <base href="../">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Oyun">
    <meta name="robots" content="noindex, nofollow, max-image-preview:large, nosnippet">
    <meta name="googlebot" content="noindex, nofollow, max-image-preview:large, nosnippet">
    <meta na    me="author" content="Alper Söylemez">
    <meta http-equiv="content-language" content="tr">
    <title>Oyun - Alper Söylemez</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/fonts/local-fonts.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <script defer src="assets/js/alpine.min.js"></script>
    <style>
        body {
            background-color: #1a202c; /* Dark background for overall page */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .game-board {
            width: 80vw;
            height: 80vh;
            background-color: #000; /* Black Tetris-like board */
            position: relative;
            border: 4px solid #4a5568;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body x-data="game()" @keydown.window="move($event.key)">

    <div class="flex flex-col items-center py-2 h-screen justify-center">
        <div class="flex justify-between w-[80vw] mb-2 px-4">
            <h1 class="text-white text-xl font-bold">Müteferriç</h1>
            <div class="text-yellow-400 text-xl font-bold">Puan: <span x-text="score"></span></div>
        </div>

        <div x-ref="board" class="game-board overflow-hidden origin-top relative">
            <!-- Collection Message -->
            <div x-show="showCollectedMessage"
                 x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="opacity-0 transform -translate-y-4"
                 x-transition:enter-end="opacity-100 transform translate-y-0"
                 x-transition:leave="transition ease-in duration-300"
                 x-transition:leave-start="opacity-100 transform translate-y-0"
                 x-transition:leave-end="opacity-0 transform -translate-y-4"
                 class="absolute top-4 left-1/2 -translate-x-1/2 bg-yellow-400 text-black px-8 py-3 rounded-full font-bold shadow-2xl z-50 pointer-events-none whitespace-nowrap text-xl"
                 x-text="collectedItemName">
            </div>
            <!-- Items -->
            <template x-for="item in items" :key="item.id">
                <div
                    class="absolute text-4xl z-30"
                    :style="`left: ${item.x}px; top: ${item.y}px; transform: translate(-50%, -50%);`"
                    x-text="item.icon"
                ></div>
            </template>

            <!-- Child Silhouette SVG -->
            <div
                class="absolute transition-all duration-75 ease-linear"
                :style="`left: ${x}px; top: ${y}px; transform: translate(-50%, -50%);`"
            >
                <svg width="40" height="60" viewBox="0 0 40 60" fill="white" xmlns="http://www.w3.org/2000/svg">
                    <!-- Head -->
                    <circle cx="20" cy="10" r="8" />
                    <!-- Body -->
                    <path d="M12 20 C12 20, 8 45, 12 55 L28 55 C32 45, 28 20, 28 20 Z" />
                    <!-- Arms -->
                    <path d="M12 22 L4 35 M28 22 L36 35" stroke="white" stroke-width="4" stroke-linecap="round" />
                    <!-- Legs -->
                    <path d="M15 55 L12 70 M25 55 L28 70" stroke="white" stroke-width="4" stroke-linecap="round" />
                </svg>
            </div>
        </div>

        <!-- Control Buttons -->
        <div class="mt-2 grid grid-cols-3 gap-2">
            <div></div>
            <button @click="move('ArrowUp')" class="w-14 h-14 sm:w-16 sm:h-16 bg-gray-700 hover:bg-gray-600 active:bg-gray-500 rounded-xl flex items-center justify-center text-white text-2xl shadow-lg border-b-4 border-gray-900 active:border-b-0 active:translate-y-1 transition-all">
                ▲
            </button>
            <div></div>

            <button @click="move('ArrowLeft')" class="w-14 h-14 sm:w-16 sm:h-16 bg-gray-700 hover:bg-gray-600 active:bg-gray-500 rounded-xl flex items-center justify-center text-white text-2xl shadow-lg border-b-4 border-gray-900 active:border-b-0 active:translate-y-1 transition-all">
                ◀
            </button>
            <button @click="move('ArrowDown')" class="w-14 h-14 sm:w-16 sm:h-16 bg-gray-700 hover:bg-gray-600 active:bg-gray-500 rounded-xl flex items-center justify-center text-white text-2xl shadow-lg border-b-4 border-gray-900 active:border-b-0 active:translate-y-1 transition-all">
                ▼
            </button>
            <button @click="move('ArrowRight')" class="w-14 h-14 sm:w-16 sm:h-16 bg-gray-700 hover:bg-gray-600 active:bg-gray-500 rounded-xl flex items-center justify-center text-white text-2xl shadow-lg border-b-4 border-gray-900 active:border-b-0 active:translate-y-1 transition-all">
                ▶
            </button>
        </div>

        <div class="mt-2 text-gray-400 text-[10px]">
            Yön tuşları veya WASD ile hareket ettir.
        </div>
    </div>

    <script>
        function game() {
            return {
                x: 0,
                y: 0,
                step: 20,
                width: 0,
                height: 0,
                score: 0,
                collectedItemName: '',
                showCollectedMessage: false,
                messageTimeout: null,
                items: [],
                itemTypes: [
                    // Fruits & Veggies
                    { name: 'Kiraz 🍒', type: 'cherry', icon: '🍒', points: 10 },
                    { name: 'Portakal 🍊', type: 'orange', icon: '🍊', points: 15 },
                    { name: 'Elma 🍎', type: 'apple', icon: '🍎', points: 20 },
                    { name: 'Muz 🍌', type: 'banana', icon: '🍌', points: 25 },
                    { name: 'Karpuz 🍉', type: 'watermelon', icon: '🍉', points: 30 },
                    { name: 'Havuç 🥕', type: 'carrot', icon: '🥕', points: 10 },
                    { name: 'Patlıcan 🍆', type: 'eggplant', icon: '🍆', points: 20 },
                    { name: 'Domates 🍅', type: 'tomato', icon: '🍅', points: 15 },
                    { name: 'Mısır 🌽', type: 'corn', icon: '🌽', points: 25 },
                    // Everyday Objects
                    { name: 'Top ⚽', type: 'ball', icon: '⚽', points: 10 },
                    { name: 'Araba 🚗', type: 'car', icon: '🚗', points: 30 },
                    { name: 'Kitap 📚', type: 'book', icon: '📚', points: 20 },
                    { name: 'Kalem ✏️', type: 'pencil', icon: '✏️', points: 10 },
                    { name: 'Saat ⌚', type: 'watch', icon: '⌚', points: 25 },
                    { name: 'Ev 🏠', type: 'house', icon: '🏠', points: 50 },
                    { name: 'Ayakkabı 👟', type: 'shoe', icon: '👟', points: 15 },
                    { name: 'Güneş ☀️', type: 'sun', icon: '☀️', points: 40 },
                    { name: 'Yıldız ⭐', type: 'star', icon: '⭐', points: 30 },
                    { name: 'Çiçek 🌸', type: 'flower', icon: '🌸', points: 10 },
                    { name: 'Oyuncak Ayı 🧸', type: 'teddy', icon: '🧸', points: 20 },
                    { name: 'Bisiklet 🚲', type: 'bike', icon: '🚲', points: 35 },
                    { name: 'Sırt Çantası 🎒', type: 'backpack', icon: '🎒', points: 20 },
                    { name: 'Süt 🥛', type: 'milk', icon: '🥛', points: 15 }
                ],

                init() {
                    this.updateDimensions();
                    window.addEventListener('resize', () => this.updateDimensions());
                    this.spawnItem();
                    setInterval(() => {
                        if (this.items.length < 5) {
                            this.spawnItem();
                        }
                    }, 3000);
                },

                updateDimensions() {
                    this.width = this.$refs.board.offsetWidth;
                    this.height = this.$refs.board.offsetHeight;

                    // Initial centering
                    if (this.x === 0 && this.y === 0) {
                        this.x = this.width / 2;
                        this.y = this.height / 2;
                    }

                    // Constrain on resize
                    this.x = Math.max(20, Math.min(this.x, this.width - 20));
                    this.y = Math.max(30, Math.min(this.y, this.height - 30));
                },

                spawnItem() {
                    const itemType = this.itemTypes[Math.floor(Math.random() * this.itemTypes.length)];
                    const newItem = {
                        id: Date.now() + Math.random(), // More unique ID
                        x: Math.floor(Math.random() * (this.width - 60)) + 30,
                        y: Math.floor(Math.random() * (this.height - 60)) + 30,
                        ...itemType
                    };
                    this.items.push(newItem);
                },

                checkCollection() {
                    this.items = this.items.filter(item => {
                        const dist = Math.sqrt(Math.pow(this.x - item.x, 2) + Math.pow(this.y - item.y, 2));
                        if (dist < 30) { // Collision radius
                            this.score += item.points;
                            this.displayCollectionMessage(item.name);
                            return false;
                        }
                        return true;
                    });
                },

                displayCollectionMessage(name) {
                    this.collectedItemName = name;
                    this.showCollectedMessage = true;
                    if (this.messageTimeout) clearTimeout(this.messageTimeout);
                    this.messageTimeout = setTimeout(() => {
                        this.showCollectedMessage = false;
                    }, 2000);
                },

                move(key) {
                    switch(key.toLowerCase()) {
                        case 'arrowup':
                        case 'w':
                            if (this.y > 30) this.y -= this.step;
                            break;
                        case 'arrowdown':
                        case 's':
                            if (this.y < this.height - 30) this.y += this.step;
                            break;
                        case 'arrowleft':
                        case 'a':
                            if (this.x > 20) this.x -= this.step;
                            break;
                        case 'arrowright':
                        case 'd':
                            if (this.x < this.width - 20) this.x += this.step;
                            break;
                    }
                    this.checkCollection();
                }
            }
        }
    </script>
    <script src="assets/js/static-features.js"></script>
</body>
</html>
